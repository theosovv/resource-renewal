packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.15'
  - '@nestjs/common@12.6.0'
  - '@nestjs/core@12.6.0'
  - '@nestjs/platform-express@12.6.0'
  - '@nestjs/testing@12.6.0'
